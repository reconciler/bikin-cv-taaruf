<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Bikin CV Taaruf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface2:#F7FAF9; --ink:#14302A; --muted:#566B65; --line:#D2DDDA;
  --accent:#0F5C4E; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --warn:#8A4B00; --warn-soft:#FFF0D6; --bad:#B3261E; --bad-soft:#FCE8E6; --ok:#1B6E3A; --focus:#0B6FD6; --fill:#EAF3EF;
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-disp:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1815; --surface:#15231F; --surface2:#1A2B26; --ink:#E4F0EC; --muted:#9BB0AA; --line:#2A423C;
    --accent:#4CC2A9; --accent-ink:#06231D; --accent-soft:#1C3A34;
    --warn:#F2B85C; --warn-soft:#3A2C10; --bad:#FF8A80; --bad-soft:#3F1B18; --ok:#7BD59B; --focus:#6CB6FF; --fill:#1F3832;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1815; --surface:#15231F; --surface2:#1A2B26; --ink:#E4F0EC; --muted:#9BB0AA; --line:#2A423C;
  --accent:#4CC2A9; --accent-ink:#06231D; --accent-soft:#1C3A34;
  --warn:#F2B85C; --warn-soft:#3A2C10; --bad:#FF8A80; --bad-soft:#3F1B18; --ok:#7BD59B; --focus:#6CB6FF; --fill:#1F3832;
}
/* palet per jenis kelamin (aktif setelah masuk form) */
:root[data-g="I"]{--accent:#1C4F8A; --accent-soft:#DCE7F4; --fill:#EBF1F9}
:root[data-g="A"]{--accent:#8A2D5B; --accent-soft:#F4DFE9; --fill:#F9EEF3}
@media (prefers-color-scheme: dark){
  :root[data-g="I"]:not([data-theme="light"]){--accent:#8DB8EE; --accent-ink:#0A1A2E; --accent-soft:#1D2D42; --fill:#1B2A3A}
  :root[data-g="A"]:not([data-theme="light"]){--accent:#EBA1C6; --accent-ink:#2B0D1C; --accent-soft:#3A2130; --fill:#32222C}
}
:root[data-theme="dark"][data-g="I"]{--accent:#8DB8EE; --accent-ink:#0A1A2E; --accent-soft:#1D2D42; --fill:#1B2A3A}
:root[data-theme="dark"][data-g="A"]{--accent:#EBA1C6; --accent-ink:#2B0D1C; --accent-soft:#3A2130; --fill:#32222C}
*{box-sizing:border-box}
[hidden]{display:none!important}
dialog.confirm{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);color:var(--ink);max-width:min(92vw,460px)}
dialog.confirm::backdrop{background:rgba(0,0,0,.55)}
dialog.confirm h2{font-size:1.15rem;margin-bottom:8px}
dialog.confirm p{color:var(--muted);font-size:.9375rem}
dialog.confirm .drow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:flex-end}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 6px;font-size:.875rem;font-weight:500}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:880px;margin-inline:auto;padding-block:16px 32px}
h1,h2,h3{font-family:var(--font-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.4vw,2.2rem);line-height:1.14}
h2{font-size:1.35rem;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.brandbtn{border:0;background:none;padding:0;cursor:pointer;min-height:44px;text-align:left}
.brand{font-family:var(--font-disp);font-weight:700;font-size:1.02rem;color:var(--accent);display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px}
.gbadge{font-family:var(--font-ui);font-size:.6875rem;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:99px}
.topr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.8125rem;font-weight:600;border:0}
.tag.plain{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500}
button.tag{cursor:pointer}

/* section nav */
#secnavwrap{margin-bottom:14px}
.navbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.navcur{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:4px 2px;border:0;background:none;cursor:pointer;text-align:left}
.navcur .nc1{display:block;font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.navcur .nc2{display:block;font-family:var(--font-disp);font-weight:700;font-size:1rem}
.navcur .chev{flex:none;font-size:.8125rem;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:99px;background:var(--accent-soft)}
.secnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.secnav:not(.open){display:none}
.sidehead{display:none}
.secbtn{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 10px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;font-size:.875rem;text-align:left}
.secbtn:hover{background:var(--surface2)}
.secbtn .secn{flex:none;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-family:var(--font-disp);font-weight:700;font-size:.8125rem;color:var(--accent);background:var(--accent-soft)}
.secbtn .sect{flex:1;min-width:0}
.secbtn.cur{border-color:var(--accent);background:var(--accent-soft)}
.secbtn.done .secn{background:var(--accent);color:var(--accent-ink)}
.secbtn .secc{color:var(--muted);font-size:.75rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.secbtn.done .secc{color:var(--ok);font-weight:700}

/* top menu */
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menupanel{position:absolute;right:0;top:calc(100% + 6px);z-index:15;width:min(92vw,330px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:grid;gap:8px}
.menupanel .mstat{font-size:.8125rem;color:var(--muted)}
.menupanel .btn{width:100%;min-height:42px;text-align:left}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){.menupanel{position:fixed;left:16px;right:16px;top:60px;width:auto}}
.menupanel .mnote{font-size:.75rem;color:var(--muted);line-height:1.4}

/* progress */
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* layout */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.lead{margin-top:6px;color:var(--muted);max-width:64ch}
fieldset.grp{border:0;margin:0 0 22px;padding:0;min-width:0}
section.grp{margin:0 0 22px}
fieldset.grp>legend,.gt{padding:0;margin:0 0 8px;font-family:var(--font-ui);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fld{padding:14px 16px;border-top:1px solid var(--line);transition:box-shadow .15s}
.card>.fld:first-child{border-top:0}
.fld>.lbl{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.875rem;font-weight:600;color:var(--muted);margin-bottom:8px;line-height:1.35}
.fstat{flex:none}
.req{font-size:.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:99px;white-space:nowrap}
.okbadge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ok);white-space:nowrap}
.hint{font-size:.8125rem;color:var(--muted);margin:-2px 0 8px}
.err{font-size:.8125rem;color:var(--bad);margin-top:6px;font-weight:600}
.fld.need{box-shadow:inset 3px 0 0 var(--accent)}
.fld.invalid{box-shadow:inset 4px 0 0 var(--bad)}
input[type=text],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1.03rem;line-height:1.5}
textarea{min-height:80px;resize:vertical}
.hasval{background:var(--fill)!important;border-color:transparent!important}
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input:disabled{opacity:.55}
.cntrow{margin-top:6px;font-size:.8125rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}

/* list editor */
.listedit{display:grid;gap:8px}
.listrow{display:flex;gap:8px;align-items:center}
.listrow input{flex:1}

/* table editor */
.tableedit{display:grid;gap:12px}
.rowbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.rowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.8125rem;font-weight:600;color:var(--muted)}
.rowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cell{display:grid;gap:4px;min-width:0}
.celllbl{font-size:.75rem;color:var(--muted)}

/* matrix editor */
.matrixedit{display:grid;gap:10px}
.matrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.matrow>.mrl{font-weight:600;font-size:.9375rem;margin-bottom:8px}
.matcells{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.matcells label{display:grid;gap:4px;font-size:.75rem;color:var(--muted);font-weight:600}
.matcells textarea{min-height:60px;color:var(--ink);font-weight:400}

/* section head + summary (review) */
.sechead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.stag{flex:none;margin-top:4px;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.stag.todo{background:var(--warn-soft);color:var(--warn)}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.btn.sm{min-height:40px;padding:0 14px;font-size:.875rem}
dl.sum{margin:0}
.sum .r{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;padding:12px 16px;border-top:1px solid var(--line)}
.sum .r:first-child{border-top:0}
.sum dt{grid-column:1;grid-row:1;font-size:.8125rem;font-weight:600;color:var(--muted);line-height:1.35}
.sum dd{margin:0}
.sum .v{grid-column:1;grid-row:2;font-size:1rem;color:var(--ink);overflow-wrap:anywhere;line-height:1.5}
.sum .v.empty{color:var(--muted);font-style:italic}
.sum .v.reqmiss{color:var(--bad);font-style:normal;font-weight:600}
.sum .v .clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.sum .v ul{margin:2px 0 0;padding-left:18px}
.sum .v li+li{margin-top:2px}
.sum .reqnote{font-size:.8125rem;color:var(--bad);font-weight:600;margin-top:2px}
.sum .ch{grid-column:2;grid-row:1/span 2;align-self:center}
.sum .ch button{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;min-width:44px;padding:0 4px}
@media (min-width:700px){.sum .r{grid-template-columns:220px minmax(0,1fr) auto}.sum dt{grid-column:1;grid-row:1}.sum .v{grid-column:2;grid-row:1}.sum .ch{grid-column:3;grid-row:1}}

/* action bar */
.actions{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);margin:18px -16px 0;padding:0 0 env(safe-area-inset-bottom,0px)}
.actions .prog{height:4px;background:var(--line)}
.actions .prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.actions .meta{display:flex;justify-content:space-between;gap:10px;padding:6px 16px 0;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.actions .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow{display:flex;gap:8px;align-items:center;padding:8px 16px 12px}
.btn.ic{width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn .icn{display:inline-grid;place-items:center;line-height:0}
.btn .lw{display:none}
.btn.nx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:5px 14px;line-height:1.2;text-align:left}
.btn.nx small{font-size:.75rem;font-weight:500;opacity:.9;white-space:nowrap}
.btn.nx b{display:block;max-width:100%;font-size:.90625rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:600px){.btn.ic{width:auto;padding:0 16px}.btn .lw{display:inline}.btn.nx{flex:0 1 auto;min-width:230px;margin-left:auto}}
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}
.badge{font-size:.75rem;font-weight:700;color:var(--ok);margin-left:6px}
.alert{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:.9375rem}
.alert b{display:block;margin-bottom:4px}

/* landing */
.hero{display:grid;gap:10px;margin-bottom:16px}
.closure ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.draftbox{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.genrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.toast{pointer-events:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.875rem;max-width:min(92vw,420px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.lab{margin-top:26px;border:1px dashed var(--line);border-radius:14px;background:var(--surface2)}
.lab>summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--muted)}
.lab .in{padding:0 16px 14px;display:grid;gap:12px}
.lab .row{display:flex;gap:8px;flex-wrap:wrap}
.lab .btn{min-height:38px;padding:0 12px;font-size:.8125rem}

@media (max-width:520px){.btn{padding:0 12px;font-size:.9375rem}.actions{gap:8px}}
/* desktop: daftar bagian menempel di kiri */
@media (min-width:960px){
  .wrap{max-width:1000px}
  .layout.withnav{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
  .layout.withnav #secnavwrap{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;margin:0;overscroll-behavior:contain}
  .layout.withnav main{max-width:680px;min-width:0}
  .layout.withnav .navbar{padding:12px 10px}
  .layout.withnav .navcur{display:none}
  .layout.withnav .sidehead{display:block;margin:2px 8px 8px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .layout.withnav .secnav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;border:0}
  .layout.withnav .secbtn{min-height:40px}
  .layout.withnav .actions{margin:18px 0 0;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="top">
    <button type="button" class="brand brandbtn" id="homebtn" title="Kembali ke halaman depan (isian tetap tersimpan)">Bikin CV Taaruf</button>
    <div class="topr" id="topr"></div>
  </header>
  <div class="layout" id="layout">
    <aside id="secnavwrap" hidden></aside>
    <main id="main"></main>
  </div>
  <details class="lab" id="lab">
    <summary>Panel uji prototipe (tidak ada di versi rilis)</summary>
    <div class="in" id="labin"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="confirm" id="dlgreset" aria-labelledby="dlgreset-t">
  <h2 id="dlgreset-t">Hapus draf dan mulai dari awal?</h2>
  <p>Semua isian yang tersimpan di perangkat ini akan dihapus dan tidak bisa dikembalikan. Berkas cadangan (.json) yang sudah terunduh tidak ikut terhapus.</p>
  <div class="drow">
    <button type="button" class="btn" id="dlgreset-bk">Unduh cadangan dulu</button>
    <button type="button" class="btn" id="dlgreset-no" autofocus>Batal</button>
    <button type="button" class="btn danger" id="dlgreset-yes">Hapus dan mulai baru</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

}

    case 'sibling': return !!x && (!!x.only || (trimStr(x.n)!==''&&trimStr(x.of)!==''));
    case 'selectText': return !!x && (trimStr(x.lvl)!==''||trimStr(x.txt)!=='');
    case 'list': return Array.isArray(x) && x.some(v=>trimStr(v)!=='');
    case 'table': return Array.isArray(x) && x.some(row=>row && Object.values(row).some(v=>trimStr(v)!==''));

    case 'table': { const rows=(x||[]).filter(row=>row&&Object.values(row).some(v=>trimStr(v)!=='')); return rows.length>=(f.extra.minRows||1); }
    case 'matrix': { if(!x) return false; const need=f.extra.rowLabels.length*f.extra.colLabels.length; const have=Object.values(x).filter(v=>trimStr(v)!=='').length; return have>=need; }

/* ---------- saving files ---------- */
async function saveFile(name,blob){
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:blob}); return 'saved'; }
    catch(e){ return (e&&e.code==='declined')?'declined':'error'; }
  }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); return 'saved';
  }catch(e){ return 'error'; }
}
function downloadBackupSilently(){
  try{
    const blob=new Blob([JSON.stringify(draftPayload())],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='cadangan-bikin-cv-taaruf.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    lastBackupTs=Date.now(); dirty=false; return true;
  }catch(e){ return false; }
}
async function manualBackup(payload){
  const blob=new Blob([JSON.stringify(payload&&payload.d?payload:draftPayload())],{type:'application/json'});
  const res=await saveFile('cadangan-bikin-cv-taaruf.json',blob);
  if(res==='saved'){ lastBackupTs=Date.now(); dirty=false; toast('Cadangan diunduh.'); }
  else if(res==='declined') toast('Penyimpanan dibatalkan.');
  else toast('Unduhan tidak berjalan di sini.',4500);
  saveDraft(); updateBackupStat();
}
const BACKUP_MIN_MS=180000;
function maybeAutoBackup(minGap){
  if(!dirty) return;
  if(Date.now()-lastBackupTs < (minGap!=null?minGap:BACKUP_MIN_MS)) return;
  if(downloadBackupSilently()){ saveDraft(); updateBackupStat(); }
}
function backupStatusText(){ return lastBackupTs? ('Cadangan otomatis terakhir '+new Date(lastBackupTs).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})) : 'Cadangan otomatis: belum ada'; }
function updateBackupStat(){ const el=document.getElementById('backupstat'); if(el) el.textContent=backupStatusText(); }
function fileLoadButton(label,cls){
  const inp=h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        if(!obj||typeof obj.d!=='object') throw new Error('format tidak dikenali');
        const doApply=()=>applyDraft(obj);
        if(S.stage==='form'&&Object.keys(S.d).length){
          if(confirm('Memuat berkas ini akan menimpa isian yang sedang berjalan di sesi ini. Lanjutkan?')) doApply();
        } else doApply();
      }catch(err){ toast('Berkas tidak dapat dibaca. Gunakan berkas cadangan (.json) dari formulir ini.',5000); }
      inp.value='';
    };
    reader.readAsText(file);
  }});
  const btn=h('button',{type:'button',class:cls||'btn',onclick:()=>inp.click()},label||'Muat draf dari berkas cadangan (.json)');
  return h('span',null,btn,inp);

  if(missAll.length){

    const secsWithMiss=[...new Set(missAll.map(f=>f.sec==='A'?'gerbang awal':f.sec))];
    if(S.sec==='N'){
      const al=$('#alert'); if(al){ al.hidden=false; al.innerHTML=''; al.append(h('b',null,'PDF belum bisa dibuat. Ada '+missAll.length+' isian wajib yang belum lengkap di bagian: '),secsWithMiss.join(', ')+'.'); al.scrollIntoView({block:'center'}); }
      markInvalid(S.sec);
    } else {
      const target=missAll.find(f=>f.sec!=='A')?.sec || 'B';
      go(target);
      setTimeout(()=>{ const al2=$('#alert'); if(al2){ al2.hidden=false; al2.innerHTML=''; al2.append(h('b',null,'Lengkapi dulu isian wajib berikut:'),missAll.filter(f=>f.sec===target).map(f=>f.label).join('; ')); } markInvalid(target); },50);
    }
    return;
  }
  if(!window.jspdf){ toast('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.',5000); return; }
  try{
    const doc=buildPdf(); const blob=doc.output('blob');
    const res=await saveFile(pdfName(),blob);
    if(res==='saved'){ S.pdf=true; saveDraft(); toast('PDF dibuat.'); render(); }
    else if(res==='declined') toast('Penyimpanan dibatalkan.');
    else toast('Unduhan tidak berjalan di sini.',4500);
  }catch(e){ toast('PDF gagal dibuat: '+(e&&e.message||e),5000); }
}

/* ---------- screens ---------- */
let navOpen=false;

  const g=S.d['B.03'];
  const panel=h('div',{class:'menupanel'},

  if(gc) t.append(h('span',{class:'gbadge',id:'gbadge'},gc==='A'?'AKHWAT':'IKHWAN'));

}
function renderNav(){
  const wrap=$('#secnavwrap'); wrap.hidden=false; wrap.innerHTML='';

  });
  const tg=h('button',{type:'button',class:'navcur',id:'navtoggle','aria-expanded':String(navOpen),'aria-controls':'secnav',onclick:()=>{ navOpen=!navOpen; nav.classList.toggle('open',navOpen); tg.setAttribute('aria-expanded',String(navOpen)); chev.textContent=navOpen?'Tutup daftar':'Semua bagian'; }},
    h('span',null,h('span',{class:'nc1'},'Bagian '+(i+1)+' dari '+SECTIONS.length),h('span',{class:'nc2'},sec.title.replace(/^[A-Z]\.\s*/,''))));
  const chev=h('span',{class:'chev'},navOpen?'Tutup daftar':'Semua bagian'); tg.append(chev);
  wrap.append(h('div',{class:'navbar'},tg,h('p',{class:'sidehead'},'Bagian formulir'),nav));
}
function renderLanding(main){
  main.append(h('section',{class:'hero'},
    h('h1',null,PRODUCT_NAME),
    h('p',{class:'lead'},"CV ta'aruf lengkap dalam 13 bagian, bisa dicicil kapan saja. Isian tersimpan otomatis di perangkat ini, dan berkas cadangan terunduh otomatis secara berkala agar dapat dipindah ke perangkat lain.")));
  const inSession=S.sec&&Object.keys(S.d).length>0;
  if(inSession){
    const sec=SECTIONS.find(x=>x.id===S.sec);
    main.append(h('div',{class:'draftbox'},h('div',null,h('b',null,'Isian Anda masih tersimpan. '),'Terakhir di bagian '+(sec?sec.title:S.sec)+'.'),
      h('div',{class:'genrow',style:'margin:0;align-items:center'},
        h('button',{type:'button',class:'btn primary',id:'contbtn',onclick:()=>{ S.stage='form'; saveDraft(); render(); window.scrollTo(0,0); }},'Lanjutkan mengisi'),

    main.append(h('div',{class:'draftbox'},h('div',null,h('b',null,'Draf ditemukan. '),'Tersimpan '+new Date(dr.ts).toLocaleString('id-ID')+'.'),
      h('div',{class:'genrow',style:'margin:0'},
        h('button',{type:'button',class:'btn primary',onclick:()=>applyDraft(dr)},'Lanjutkan draf'),
        h('button',{type:'button',class:'linkbtn',onclick:confirmReset},'Mulai dari awal'))));
  }
  const closure=h('section',{class:'panel closure',style:'margin-bottom:14px'},
    h('h2',{style:'font-size:1.1rem'},'Sebelum mulai'),
    h('ul',null,
      h('li',null,'Isian diproses di perangkat ini dan tidak dikirim ke server mana pun.'),
      h('li',null,'Anda dapat berpindah bagian secara bebas; tidak perlu selesai sekaligus.'),
      h('li',null,'Draf tersimpan otomatis di peramban ini. Berkas cadangan (.json) terunduh otomatis secara berkala; simpan berkas ini bila berpindah perangkat.'),
      h('li',null,'Hasil akhir berupa satu PDF untuk Anda kirimkan sendiri kepada pihak yang dituju, bukan untuk dibagikan ke publik. Tidak ada fitur unggah dokumen.'),
      h('li',null,'Formulir ini tidak meminta nama anggota keluarga, alamat lengkap, maupun tanggal lahir lengkap.')),
    h('div',{class:'card',style:'margin-top:14px'},buildField(byId['A.01']), buildField(byId['A.02']), buildField(byId['B.03'])));
  main.append(closure);
  main.append(h('div',{class:'panel',style:'margin-bottom:14px'},
    h('b',null,'Punya berkas cadangan dari perangkat lain?'),
    h('p',{class:'small muted',style:'margin:4px 0 10px'},'Pilih berkas cadangan (.json) untuk melanjutkan di sini.'),
    fileLoadButton()));
  main.append(h('div',{class:'actions',style:'margin:14px -16px 0'},h('div',{class:'arow'},h('span',{class:'spacer'}),
    h('button',{type:'button',class:'btn primary',id:'go',onclick:()=>{
      if(!(isFilled(byId['A.01'])&&isFilled(byId['A.02'])&&reqOK(byId['B.03']))) return;
      if(!S.sec) S.sec='B'; S.stage='form'; saveDraft(); render(); window.scrollTo(0,0);
    }},S.sec&&Object.keys(S.d).length?'Lanjutkan mengisi':'Mulai isi form'))));
  main.addEventListener('click',()=>setTimeout(updGo,0));
  main.addEventListener('change',()=>setTimeout(updGo,0));

  updGo();

const SEC_ORDER=SECTIONS.map(s=>s.id);
function prevSec(id){ const i=SEC_ORDER.indexOf(id); return SEC_ORDER[Math.max(0,i-1)]; }
function nextSec(id){ const i=SEC_ORDER.indexOf(id); return SEC_ORDER[Math.min(SEC_ORDER.length-1,i+1)]; }
function groupsOf(secId){
  const out=[]; let cur=null;
  bySec[secId].filter(visible).forEach(f=>{ if(!cur||f.grp){ cur={t:f.grp||null,fs:[]}; out.push(cur); } cur.fs.push(f); });
  return out;
}
function viewOf(id){ return VIEW[id] || (sectionStatus(id).done ? 'review' : 'edit'); }
function setView(id,mode){ VIEW[id]=mode; render(); window.scrollTo(0,0); }
function editField(id){
  const sec=byId[id].sec; VIEW[sec]='edit'; render();
  const el=document.getElementById('f-'+id);
  if(el){ el.scrollIntoView({block:'center'}); const c=el.querySelector('input,select,textarea,button.pill'); if(c) c.focus({preventScroll:true}); }
}
function sumValue(f){
  if(!isFilled(f)) return null;
  switch(f.type){
    case 'check': return 'Ya';
    case 'list': return h('ul',null,listItems(f).map(t=>h('li',null,t)));
    case 'table': { const cols=f.extra.cols; return h('ul',null,tableRows(f).map(r=>h('li',null,cols.map(c=>trimStr(r[c.key])).filter(Boolean).join(' · ')))); }
    case 'matrix': return h('ul',null,f.extra.rowLabels.map((rl,ri)=>h('li',null,h('b',null,rl+': '),f.extra.colLabels.map((cl,ci)=>cl+' - '+(matrixCell(f,ri,ci)||'belum diisi')).join('; '))));
    default: { const v=vText(f); return f.type==='textarea'?h('span',{class:'clamp'},v):v; }
  }
}
function sumRow(f,hideLabel){
  const v=sumValue(f); const miss=f.req&&!reqOK(f);
  const vd=v==null ? h('dd',{class:'v empty'+(miss?' reqmiss':'')},miss?'Belum diisi (wajib)':'Belum diisi') : h('dd',{class:'v'},v);
  if(v!=null&&miss) vd.append(h('div',{class:'reqnote'},'Belum lengkap (wajib)'));
  return h('div',{class:'r',id:'s-'+f.id},
    h('dt',{class:hideLabel?'sr':null},f.label), vd,
    h('dd',{class:'ch'},h('button',{type:'button','aria-label':(v==null?'Isi: ':'Ubah: ')+f.label,onclick:()=>editField(f.id)},v==null?'Isi':'Ubah')));
}
function actionBar(secId){
  const i=SEC_ORDER.indexOf(secId); const prev=SECTIONS[i-1], next=SECTIONS[i+1];
  const reqFs=F.filter(f=>f.req&&visible(f)); const done=reqFs.filter(reqOK).length; const pct=reqFs.length?Math.round(100*done/reqFs.length):0;
  const back=h('button',{type:'button',class:'btn ic',disabled:prev?null:true,'aria-label':prev?('Kembali ke bagian '+prev.title):'Kembali',title:prev?('Kembali ke '+prev.title):null,onclick:()=>{ if(prev) go(prev.id); }},
    h('span',{class:'icn',html:ICON_BACK}),h('span',{class:'lw'},'Kembali'));
  const bk=h('button',{type:'button',class:'btn ic',id:'bkbtn','aria-label':'Cadangkan: unduh berkas cadangan (.json)',title:'Unduh berkas cadangan (.json)',onclick:manualBackup},
    h('span',{class:'icn',html:ICON_DL}),h('span',{class:'lw'},'Cadangkan'));
  const nx=next
    ? h('button',{type:'button',class:'btn primary nx','aria-label':'Lanjut ke bagian '+next.title,onclick:()=>go(next.id)},h('small',null,'Lanjut ke bagian '+next.id),h('b',null,next.short))
    : h('button',{type:'button',class:'btn primary nx',onclick:genPdf},h('small',null,S.pdf?'PDF sudah dibuat':'Langkah terakhir'),h('b',null,'Buat PDF'));
  return h('div',{class:'actions'},
    h('div',{class:'prog',role:'progressbar','aria-label':'Isian wajib terisi','aria-valuemin':'0','aria-valuemax':String(reqFs.length),'aria-valuenow':String(done)},h('i',{id:'progbar',style:'width:'+pct+'%'})),
    h('div',{class:'meta'},h('span',{id:'progtxt'},done+'/'+reqFs.length+' wajib terisi'),h('span',{id:'savestat'},saveStatusText())),
    h('div',{class:'arow'},back,bk,nx));
}
function renderSectionBody(main,secId){
  const sec=SECTIONS.find(s=>s.id===secId); const st=sectionStatus(secId);
  const mode=VIEW[secId]=viewOf(secId);
  main.append(h('div',{class:'sechead'},
    h('div',null,h('h2',null,sec.title),h('p',{class:'lead'},SEC_INTRO[secId]||'')),
    h('span',{class:'stag'+(st.done?'':' todo'),id:'sectag'},st.done?'Lengkap':(st.doneCount+' dari '+st.total+' wajib'))));
  const anyFilled=bySec[secId].some(f=>visible(f)&&isFilled(f));
  if(mode==='review') main.append(h('div',{class:'modebar'},h('button',{type:'button',class:'btn sm',id:'modebtn',onclick:()=>setView(secId,'edit')},'Ubah isian bagian ini')));
  else if(anyFilled) main.append(h('div',{class:'modebar'},h('button',{type:'button',class:'btn sm',id:'modebtn',onclick:()=>setView(secId,'review')},'Lihat ringkasan')));
  main.append(h('div',{class:'alert',id:'alert',role:'alert',hidden:true}));
  groupsOf(secId).forEach(g=>{
    const single=g.fs.length===1&&g.fs[0].label===g.t;
    if(mode==='review'){
      main.append(h('section',{class:'grp'},g.t?h('h3',{class:'gt'},g.t):null,h('div',{class:'card'},h('dl',{class:'sum'},g.fs.map(f=>sumRow(f,single))))));
    } else {
      const els=g.fs.map(buildField);
      if(single){ const sp=els[0].querySelector('.lbl>span'); if(sp) sp.classList.add('sr'); }
      main.append(h('fieldset',{class:'grp','aria-label':g.t?null:sec.title},g.t?h('legend',null,g.t):null,h('div',{class:'card'},els)));
    }
  });
  if(secId==='N'){
    main.append(h('div',{class:'panel',style:'margin-bottom:14px'},
      h('b',null,'Sebelum mengirim PDF'),
      h('ul',{style:'margin-top:8px;padding-left:20px;display:grid;gap:4px'},
        h('li',null,'Kirim lewat pesan pribadi kepada pihak yang dituju, atau kepada walinya.'),
        h('li',null,'Jangan unggah ke grup, media sosial, atau tautan publik. Setiap halaman PDF memuat catatan "Mohon tidak disebarluaskan".'),
        h('li',null,'Untuk dibagikan ke publik, gunakan kartu dari generator versi mini yang tidak memuat data pribadi.'))));
    main.append(h('div',{class:'panel',style:'margin-bottom:14px'},
      h('b',null,'Lampiran yang perlu disiapkan terpisah'),
      h('p',{class:'small muted',style:'margin-top:4px'},'Berkas ini tidak diunggah di sini. Daftar berikut hanya pengingat dan dicantumkan sebagai daftar centang pada PDF.'),
      h('ul',{style:'margin-top:8px;padding-left:20px'},ATTACH.map(a=>h('li',null,a)))));
  }
  main.append(actionBar(secId));
  if(mode==='edit'&&tried) markInvalid(secId);
}
function hasAnyDraft(){ return Object.keys(S.d).length>0 || !!resumeOffer; }
function resetAll(){
  clearDraft(); S.d={}; S.stage='landing'; S.sec=null; S.pdf=false; tried=false;
  Object.keys(VIEW).forEach(k=>delete VIEW[k]); lastBackupTs=0; dirty=false; resumeOffer=null;
  render(); window.scrollTo(0,0); toast('Draf dihapus. Silakan mulai dari awal.');
}
function confirmReset(){
  const dm=document.querySelector('details.menu[open]'); if(dm) dm.open=false;
  const d=$('#dlgreset'); if(d.showModal) d.showModal(); else d.setAttribute('open','');
  $('#dlgreset-no').focus();
}
function closeReset(){ const d=$('#dlgreset'); if(d.close) d.close(); else d.removeAttribute('open'); }
function goHome(){ if(S.stage==='form'){ saveDraft(); S.stage='landing'; render(); } window.scrollTo(0,0); }
function applyTheme(){
  const g=S.stage==='form'?GV():null;
  if(g) document.documentElement.setAttribute('data-g',g); else document.documentElement.removeAttribute('data-g');
  $('#layout').classList.toggle('withnav',S.stage==='form');
}
function render(){
  applyTheme();
  renderTop();
  const main=$('#main'); main.innerHTML='';
  if(S.stage!=='form'){ $('#secnavwrap').hidden=true; renderLanding(main); markAllVals(main); renderLab(); return; }
  renderNav();
  renderSectionBody(main,S.sec);
  markAllVals(main);
  renderLab();
}
function go(id,mode){ maybeAutoBackup(90000); saveDraft(); S.sec=id; tried=false; if(mode) VIEW[id]=mode; else delete VIEW[id]; render(); window.scrollTo(0,0); }

/* ---------- lab panel (prototype testing only) ---------- */
function autoSample(g){ return JSON.parse(JSON.stringify(SCHEMA.samples[g])); }
function renderLab(){
  const box=$('#labin'); if(!box) return; box.innerHTML='';
  box.append(h('div',{class:'row'},
    h('button',{type:'button',class:'btn',onclick:()=>{ S.d=autoSample('I'); S.stage='form'; S.sec=S.sec||'B'; S.pdf=false; dirty=true; saveDraft(); render(); toast('Contoh data Ikhwan dimuat (data fiktif).'); }},'Isi contoh (Ikhwan)'),
    h('button',{type:'button',class:'btn',onclick:()=>{ S.d=autoSample('A'); S.stage='form'; S.sec=S.sec||'B'; S.pdf=false; dirty=true; saveDraft(); render(); toast('Contoh data Akhwat dimuat (data fiktif).'); }},'Isi contoh (Akhwat)'),
    h('button',{type:'button',class:'btn',onclick:()=>{ clearDraft(); S.d={}; S.stage='landing'; S.sec=null; S.pdf=false; tried=false; render(); toast('Semua isian dikosongkan.'); }},'Kosongkan semua')));
  box.append(h('p',{class:'small muted'},'Panel ini hanya untuk menguji formulir dan dihapus pada versi rilis.'));
}

/* ---------- boot ---------- */
const dr0=loadDraft(); if(draftHasData(dr0)) resumeOffer=dr0;
render();
setInterval(()=>maybeAutoBackup(BACKUP_MIN_MS),30000);
$('#homebtn').addEventListener('click',goHome);
$('#dlgreset-no').addEventListener('click',closeReset);
$('#dlgreset-yes').addEventListener('click',()=>{ closeReset(); resetAll(); });
$('#dlgreset-bk').addEventListener('click',()=>{ manualBackup(Object.keys(S.d).length?null:resumeOffer); });
document.addEventListener('input',e=>markVal(e.target));
document.addEventListener('change',e=>markVal(e.target));
document.addEventListener('click',e=>{ document.querySelectorAll('details.menu[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); });
window.__ctgv1={S,go,render,goHome,autoSample,maybeAutoBackup,downloadBackupSilently};
})();
