# Menayangkan hanya berkas situs ke GitHub Pages. Berkas lain (CLAUDE.md,
# AUDIT-HANDOFF-*.md, README.md) sengaja tidak ikut.
# Berkas situs baru HARUS ditambahkan ke langkah "Salin berkas situs" di bawah.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Salin berkas situs
        run: |
          mkdir -p _site/lib
          cp index.html _site/index.html
          cp lib/jspdf-2.5.1.umd.min.js _site/lib/jspdf-2.5.1.umd.min.js

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
